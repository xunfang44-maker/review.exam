        }

            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        /* 考卷選擇畫面 */
        .exam-select-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .exam-btn {
            padding: 18px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: var(--accent-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exam-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        /* 答題畫面 */
        .quiz-screen {
            display: none;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .back-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background-color: #95a5a6;
        }

            font-weight: bold;
            color: var(--primary-color);
        }

            padding: 20px;
            border: 1px solid #e1e8ed;
            border-radius: 8px;

        }

            background-color: #e8f4f8;

            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;

            background-color: #f0f4f8;
            padding: 10px 14px;
            border-left: 4px solid var(--accent-color);
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #444;
            line-height: 1.5;
        }

            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            font-size: 1rem;
            background-color: #f8f9fa;
            border: 1.5px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* 答題狀態 */
        .option-btn.selected-correct {
            background-color: #d4edda !important;
            border-color: var(--correct-color) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-btn.selected-wrong {
            background-color: #f8d7da !important;
            border-color: var(--wrong-color) !important;
            color: #721c24;
        }

        .option-btn.show-correct {
            background-color: #d4edda !important;
            border-color: var(--correct-color) !important;
            color: #155724;
            font-weight: bold;
        }

        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            background-color: #f1f3f5;
            border-left: 5px solid var(--accent-color);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .explanation-box.visible {
            display: block;
        }

        .result-header {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 8px;
        }

        .result-header.correct {
            color: var(--correct-color);
        }

        .result-header.wrong {
            color: var(--wrong-color);
        }

        .misconcept-note {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #ccc;
            color: #555;
        }

</head>

            text: '為了緩解紐西蘭這類因大氣變化而面臨的皮膚癌威脅，國際社會曾共同簽署多項環保公約。請問下列哪一項國際公約的管制對象，其主要目的就是為了解決上述文章中所提到的「大氣層破洞」危機？',
            options: [

let currentExamKey = '';

// 顯示選擇畫面
function showSelectScreen() {
    document.getElementById('examSelectScreen').style.display = 'flex';
    document.getElementById('quizScreen').style.display = 'none';
}

// 開始刷題
function startQuiz(examKey) {
    currentExamKey = examKey;
    const questions = examData[examKey];
    
    document.getElementById('examSelectScreen').style.display = 'none';
    document.getElementById('quizScreen').style.display = 'block';
    
    document.getElementById('progressIndicator').innerText = `題目總數：${questions.length} 題`;
    
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    questions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;

        let groupHtml = q.groupTitle ? `<div class="group-title">📋 <b>題組背景：</b>${q.groupTitle}</div>` : '';

        let optionsHtml = '';
        q.options.forEach((opt, optIndex) => {
            optionsHtml += `
                <li class="option-item">
                    <button class="option-btn" id="btn-${index}-${optIndex}" onclick="checkAnswer(${index}, ${optIndex})">
                        ${opt}
                    </button>
                </li>
            `;
        });

        card.innerHTML = `
            <div class="source-tag">[${q.source}]</div>
            ${groupHtml}
            <div class="question-text">${index + 1}. ${q.text}</div>
            <ul class="options-list">
                ${optionsHtml}
            </ul>
            <div class="explanation-box" id="explain-${index}">
                <div class="result-header" id="result-header-${index}"></div>
                <div><b>正確答案：</b>${q.options[q.answer]}</div>
                <div class="misconcept-note"><b>解析與易錯觀念：</b><br>${q.explanation}</div>
                <div style="margin-top: 6px; font-size: 0.8rem; color: #888;">對照標籤：[${q.source}]</div>
            </div>
        `;

        container.appendChild(card);
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 點擊選項核對答案
function checkAnswer(qIndex, selectedOptIndex) {
    const q = examData[currentExamKey][qIndex];
    const isCorrect = (selectedOptIndex === q.answer);

    // 禁用該題所有選項按鈕，防止重複點擊
    q.options.forEach((_, optIndex) => {
        const btn = document.getElementById(`btn-${qIndex}-${optIndex}`);
        btn.disabled = true;

        if (optIndex === q.answer) {
            btn.classList.add('show-correct');
        }
    });

    const selectedBtn = document.getElementById(`btn-${qIndex}-${selectedOptIndex}`);
    if (isCorrect) {
        selectedBtn.classList.add('selected-correct');
    } else {
        selectedBtn.classList.add('selected-wrong');
    }

    // 顯示答案與詳細解析
    const explainBox = document.getElementById(`explain-${qIndex}`);
    const resultHeader = document.getElementById(`result-header-${qIndex}`);

    if (isCorrect) {
        resultHeader.className = 'result-header correct';
        resultHeader.innerText = '⭕ 回答正確！';
    } else {
        resultHeader.className = 'result-header wrong';
        resultHeader.innerText = '❌ 回答錯誤！';
    }

    explainBox.classList.add('visible');
}
</script>
